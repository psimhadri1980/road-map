# The workspace: the web app and the gantt library's packages (a pinned submodule, T004; until
# then those folders are absent and the pattern matches nothing). Packages refer to each other
# with `workspace:*`, so they resolve to source in this tree, never to a registry.
packages:
  - web
  - vendor/gantt/packages/*

# Same patched minimatch as the gantt repository (GHSA-g3hv-75wg-m249, fixed in 11.0.1).
overrides:
  minimatch: ^11.0.8

# Supply chain, checked on every install against the lockfile (same settings as gantt):
# - a package whose new version lost the provenance or trusted publishing its earlier versions had is refused;
# - a version published less than a day ago is not used, so a compromised release has time to be caught.
trustPolicy: no-downgrade
minimumReleaseAge: 1440
