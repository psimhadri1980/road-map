openapi: 3.1.0
info:
  title: road-map service — walking skeleton
  version: 0.6.0
  description: >
    The roadmap service as seen through nginx. Read-only. Every route except health needs a bearer token
    (spec 002); a roadmap is served only to members of its owning team (spec 003). Proposals can be created and edited, never submitted yet (spec 004), submitted, reviewed and approved (spec 005). Error bodies follow the gantt library's server: {error, code}.
servers:
  - url: https://127.0.0.1:8443/api
security:
  - bearer: []
paths:
  /roadmaps:
    get:
      operationId: listRoadmaps
      summary: The roadmaps owned by the caller's teams, ordered by name. Empty when the caller is in no team.
      responses:
        '200':
          description: The visible roadmaps.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [slug, name, team, role]
                  properties:
                    slug: { type: string }
                    name: { type: string }
                    team: { type: string }
                    role: { type: string, enum: [viewer, editor, reviewer] }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /roadmaps/{slug}:
    get:
      operationId: getRoadmap
      summary: The roadmap document, served from the cache when present.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '200':
          description: The roadmap in the gantt-roadmap/1 format.
          content:
            application/json:
              schema:
                # The gantt library's schema, from the pinned submodule.
                $ref: '../../../vendor/gantt/packages/contract/schema/gantt-roadmap-1.schema.json'
        '400':
          description: The slug does not match the pattern.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: >
            No such roadmap, or the caller's teams do not own it. The two cases are indistinguishable (same
            status, same body; spec 003 FR-005).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: The stored roadmap does not conform to the gantt format and is not served.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503':
          description: >
            The database could not answer. Since spec 003 the owning team is read from it on every request, so
            a cached roadmap is not served without it (a change from spec 001 FR-008).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /roadmaps/{slug}/proposals:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' } }
    get:
      operationId: listProposals
      summary: The roadmap's Proposals, newest first. Any role of the owning team.
      responses:
        '200':
          description: The Proposals.
          content:
            { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ProposalSummary' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createProposal
      summary: A new draft Proposal with optional first changes. Editor of the owning team.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/NewProposal' } } }
      responses:
        '201':
          description: Created.
          content: { application/json: { schema: { $ref: '#/components/schemas/ProposalSummary' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Denied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /roadmaps/{slug}/proposals/{id}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getProposal
      responses:
        '200':
          {
            description: The Proposal.,
            content: { application/json: { schema: { $ref: '#/components/schemas/ProposalSummary' } } },
          }
        '404': { $ref: '#/components/responses/NotFound' }
  /roadmaps/{slug}/proposals/{id}/document:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getProposalDocument
      summary: The approved roadmap with the Proposal's changes applied, never cached.
      responses:
        '200': { description: A gantt-roadmap/1 document. }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /roadmaps/{slug}/proposals/{id}/changes:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: addChanges
      summary: Add changes to your own draft. All or nothing.
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [changes],
                    properties:
                      {
                        changes:
                          { type: array, minItems: 1, maxItems: 500, items: { $ref: '#/components/schemas/Change' } },
                      },
                  },
              },
          }
      responses:
        '200':
          {
            description: The updated Proposal.,
            content: { application/json: { schema: { $ref: '#/components/schemas/ProposalSummary' } } },
          }
        '403': { $ref: '#/components/responses/Denied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /roadmaps/{slug}/proposals/{id}/{action}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - {
          name: action,
          in: path,
          required: true,
          schema: { type: string, enum: [submit, withdraw, discard, return, reject, approve] },
        }
    post:
      operationId: moveProposal
      summary: Move a Proposal through its lifecycle. return and reject need a note.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200':
          description: The updated Proposal.
          content: { application/json: { schema: { $ref: '#/components/schemas/ProposalSummary' } } }
        '403': { $ref: '#/components/responses/Denied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
  /actuator/health/readiness:
    servers:
      # Not routed by nginx: only run/run.sh health checks call it, on the service's own port.
      - url: https://127.0.0.1:18443
    get:
      operationId: readiness
      security: [] # health stays open (spec 002 FR-013)
      summary: Ready when the database is reachable. Redis is reported but does not fail readiness (FR-008).
      responses:
        '200': { description: Ready. }
        '503': { description: Not ready. }
  /roadmaps/{slug}/versions:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      operationId: listVersions
      summary: Versions, newest first.
      responses:
        '200':
          description: The versions.
          content:
            { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/VersionSummary' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /roadmaps/{slug}/versions/{v}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: v, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getVersion
      summary: The roadmap document as it was in that version.
      responses:
        '200': { description: The roadmap document. }
        '404': { $ref: '#/components/responses/NotFound' }
  /roadmaps/{slug}/versions/{v}/restore:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: v, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      operationId: restoreVersion
      summary: Make the roadmap equal to version v, as a new version. Reviewers only.
      responses:
        '200':
          description: The new version.
          content: { application/json: { schema: { $ref: '#/components/schemas/VersionSummary' } } }
        '403': { $ref: '#/components/responses/Denied' }
        '404': { $ref: '#/components/responses/NotFound' }
  /roadmaps/{slug}/baselines:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      operationId: listBaselines
      responses:
        '200':
          description: The baselines.
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Baseline' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createBaseline
      summary: Name a version. Reviewers only; names are unique; at most 50.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                version: { type: integer, minimum: 1, description: Defaults to the current version. }
      responses:
        '201':
          description: The baseline.
          content: { application/json: { schema: { $ref: '#/components/schemas/Baseline' } } }
        '403': { $ref: '#/components/responses/Denied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Access token issued by the road-map realm for the client road-map-web, audience road-map-api.
  responses:
    Unauthenticated:
      description: >
        Missing, expired, tampered, wrong-issuer, wrong-audience or signed-out token. The front door answers
        first (status only); from the service the body is {error, code}. Never says which check failed.
      headers:
        WWW-Authenticate: { schema: { type: string, example: Bearer } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Denied: { description: 'A member of the owning team without the needed permission. Body {error, code: denied}.' }
    NotFound:
      {
        description: 'No such roadmap or Proposal, or the caller is not in the owning team: the answers are identical.',
      }
    Conflict:
      {
        description: 'The action is not allowed from the current state, or the changes no longer fit the roadmap. Body {error, code: conflict}. Nothing changed.',
      }
    Invalid: { description: 'A change or limit is invalid; nothing was stored. Body {error, code: invalid}.' }
  schemas:
    Error:
      type: object
      required: [error, code]
      properties:
        error: { type: string, description: A message for people. No internal details. }
        code:
          type: string
          enum: [invalid, denied, conflict, notFound, nonConforming, unavailable, unauthenticated]
    Change:
      type: object
      required: [entity, op, id]
      properties:
        entity: { type: string, enum: [task, link, resource, calendar, roadmap] }
        op: { type: string, enum: [create, update, delete] }
        id: { type: string, minLength: 1, maxLength: 128 }
        fields: { type: object }
    NewProposal:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        changes: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/Change' } }
    ProposalSummary:
      type: object
      required: [id, name, state, owner, createdAt, updatedAt, changeCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        state: { type: string, enum: [draft, submitted, approved, rejected, discarded] }
        note: { type: string, nullable: true, description: The latest return or rejection note. }
        noteBy: { type: string, nullable: true }
        decidedBy: { type: string, nullable: true, description: The approving reviewer. }
        decidedAt: { type: string, format: date-time, nullable: true }
        owner: { type: string, description: 'The creator: preferred_username when the token has it, else the subject.' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        changeCount: { type: integer }
    VersionSummary:
      type: object
      required: [version, at, by]
      properties:
        version: { type: integer }
        at: { type: string, format: date-time }
        by: { type: string }
        proposalId: { type: string, format: uuid, nullable: true }
        note: { type: string, nullable: true }
    Baseline:
      type: object
      required: [name, version, at, by]
      properties:
        name: { type: string }
        version: { type: integer }
        at: { type: string, format: date-time }
        by: { type: string }
