# Changes to specs/001-walking-skeleton/contracts/openapi.yaml made by spec 002. The 001 file is not edited
# (it is the record of spec 001); an implementation task merges this delta into it when the code lands.
# Merged in T006: the 001 contract file now carries these changes (version 0.2.0); this file stays as the record.
openapi: 3.1.0
info: { title: road-map service, version: 0.2.0 }
security:
  - bearer: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Access token issued by the road-map realm for the client road-map-web, audience road-map-api.
        Required on every route except the health endpoints.
  responses:
    Unauthenticated:
      description: >
        Missing, expired, tampered, wrong-issuer, wrong-audience or signed-out token. At the front door the body is
        whatever the front door returns (status only matters); from the service it is {error, code}. Never says
        which check failed.
      headers:
        WWW-Authenticate: { schema: { type: string, example: Bearer } }
      content:
        application/json:
          schema:
            type: object
            required: [error, code]
            properties:
              error: { type: string }
              code: { type: string, enum: [unauthenticated] }
  schemas:
    ErrorCodeAddition:
      description: The Error.code enum of the 001 contract gains `unauthenticated`.
      type: string
      enum: [invalid, notFound, nonConforming, unavailable, unauthenticated]
paths:
  /roadmaps/{slug}:
    get:
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /actuator/health/readiness:
    get:
      security: [] # health stays open (FR-013); not routed by the front door, served on the service's own port
  /auth/:
    description: >
      The front door forwards /auth/ unchanged to Keycloak (sign-in pages, token, userinfo, logout). Its own
      contract is Keycloak's documentation; nothing is specified here.
