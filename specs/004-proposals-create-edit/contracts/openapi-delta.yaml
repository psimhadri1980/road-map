# Changes to specs/001-walking-skeleton/contracts/openapi.yaml made by spec 004; merged by the close-out task.
openapi: 3.1.0
info: { title: road-map service, version: 0.4.0 }
paths:
  /roadmaps/{slug}/proposals:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' } }
    get:
      operationId: listProposals
      summary: The roadmap's Proposals, newest first. Any role of the owning team.
      responses:
        '200':
          description: The Proposals.
          content:
            { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ProposalSummary' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createProposal
      summary: A new draft Proposal with optional first changes. Editor of the owning team.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/NewProposal' } } }
      responses:
        '201':
          description: Created.
          content: { application/json: { schema: { $ref: '#/components/schemas/ProposalSummary' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Denied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /roadmaps/{slug}/proposals/{id}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getProposal
      responses:
        '200':
          {
            description: The Proposal.,
            content: { application/json: { schema: { $ref: '#/components/schemas/ProposalSummary' } } },
          }
        '404': { $ref: '#/components/responses/NotFound' }
  /roadmaps/{slug}/proposals/{id}/document:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getProposalDocument
      summary: The approved roadmap with the Proposal's changes applied, never cached.
      responses:
        '200': { description: A gantt-roadmap/1 document. }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /roadmaps/{slug}/proposals/{id}/changes:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: addChanges
      summary: Add changes to your own draft. All or nothing.
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [changes],
                    properties:
                      {
                        changes:
                          { type: array, minItems: 1, maxItems: 500, items: { $ref: '#/components/schemas/Change' } },
                      },
                  },
              },
          }
      responses:
        '200':
          {
            description: The updated Proposal.,
            content: { application/json: { schema: { $ref: '#/components/schemas/ProposalSummary' } } },
          }
        '403': { $ref: '#/components/responses/Denied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
components:
  schemas:
    Change:
      type: object
      required: [entity, op, id]
      properties:
        entity: { type: string, enum: [task, link, resource, calendar, roadmap] }
        op: { type: string, enum: [create, update, delete] }
        id: { type: string, minLength: 1, maxLength: 128 }
        fields: { type: object }
    NewProposal:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        changes: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/Change' } }
    ProposalSummary:
      type: object
      required: [id, name, state, owner, createdAt, updatedAt, changeCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        state: { type: string, enum: [draft] }
        owner: { type: string, description: 'The creator: preferred_username when the token has it, else the subject.' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        changeCount: { type: integer }
  responses:
    Denied: { description: 'A member of the owning team without the needed permission. Body {error, code: denied}.' }
    NotFound:
      {
        description: 'No such roadmap or Proposal, or the caller is not in the owning team: the answers are identical.',
      }
    Invalid: { description: 'A change or limit is invalid; nothing was stored. Body {error, code: invalid}.' }
