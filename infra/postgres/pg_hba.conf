# Who may connect, and how (T009, FR-013, FR-014, FR-016).
# Network access is TLS-only (`hostssl`): a plain-text connection matches no line and is refused.
# Each account reaches only its own database. The superuser has no network access at all.
# TYPE   DATABASE  USER                           ADDRESS         METHOD
# The one non-network line: the container's own init scripts run as the postgres OS user on the
# unix socket inside the container, which the host network cannot reach.
local    all       postgres                                       peer
hostssl  roadmap   roadmap_migrator,roadmap_app   127.0.0.1/32    scram-sha-256
hostssl  keycloak  keycloak                       127.0.0.1/32    scram-sha-256
