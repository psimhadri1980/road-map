# nginx (T014): the only front door. TLS 1.3 on 8443, a redirect-only port on 18080, both on 127.0.0.1
# (FR-001, FR-013, FR-015, FR-019). Everything behind it is reached over HTTPS with the upstream
# certificate verified against the project CA. Runs as non-root with temporary files in tmpfs.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # FR-019: 10 requests per second per client, bursts of 20; the excess gets 429.
  limit_req_zone $binary_remote_addr zone=perclient:10m rate=10r/s;
  limit_req_status 429;

  # The plain port exists only to send browsers to HTTPS.
  server {
    listen 127.0.0.1:18080;
    return 301 https://127.0.0.1:8443$request_uri;
  }

  server {
    listen 127.0.0.1:8443 ssl;
    ssl_certificate /tls/server.crt;
    ssl_certificate_key /tls/server.key;
    ssl_protocols TLSv1.3;

    limit_req zone=perclient burst=20 nodelay;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; worker-src 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Upstream TLS: verified against the project CA, TLS 1.3 only (FR-013).
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /tls/ca.crt;
    proxy_ssl_protocols TLSv1.3;
    proxy_ssl_name localhost;   # matched against the DNS SAN of every upstream certificate
    proxy_http_version 1.1;

    # The web app (T020). Unknown paths fall back to index.html so a reloaded page still loads;
    # /api/ and /auth/ have their own locations and never reach this fallback.
    location / {
      root /usr/share/nginx/html;
      try_files $uri /index.html;
    }

    # Operations endpoints are for the orchestrator on the service's own port, never the public one.
    location ^~ /api/actuator {
      return 404;
    }

    location /api/ {
      proxy_pass https://127.0.0.1:18443;
    }

    # Identity provider (002-T001), forwarded unchanged: Keycloak is served under /auth itself. It sends its
    # own Content-Security-Policy for its pages, so the server-level one is not repeated here (add_header in a
    # location replaces the inherited set); the other headers are restated.
    location /auth/ {
      add_header Strict-Transport-Security "max-age=31536000" always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      proxy_pass https://127.0.0.1:18444;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $http_host;
    }
  }
}
