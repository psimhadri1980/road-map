# Keycloak (T011): identity provider, HTTPS only, its own database over verify-full (FR-001, FR-013, FR-016).
# The realm is empty until spec 002 adds clients and sign-in.
apiVersion: road-map/v1
kind: Component
name: keycloak
category: infra
description: Keycloak over HTTPS; the empty road-map realm
dependsOn: [postgres]
ports:
  https: 18444
  management: 19000
health:
  # Keycloak's own readiness endpoint on the management port, probed over HTTPS against the project CA.
  http: /health/ready
  port: 19000
  timeout: 180
provides:
  common:
    KEYCLOAK_URL: https://127.0.0.1:18444
env:
  common:
    KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
runtimes:
  default: podman
  podman:
    build:
      artifact: none
      args:
        KEYCLOAK_IMAGE: ${KEYCLOAK_IMAGE}
    # Runs as keycloak (uid 1000), never root; the host user maps to it so the mounted key is readable.
    user: '1000:1000'
    userns: keep-id:uid=1000,gid=1000
    readOnly: true
    # data/ holds the realm import and the process's scratch files; none of it outlives the container.
    tmpfs: [/tmp, /opt/keycloak/data]
    mounts:
      - { src: infra/keycloak/road-map-realm.json, dst: /opt/keycloak/data/import/road-map.json, ro: true }
      - { src: run/certs/keycloak.crt, dst: /tls/server.crt, ro: true }
      - { src: run/certs/keycloak.key, dst: /tls/server.key, ro: true }
      - { src: run/certs/ca.crt, dst: /tls/ca.crt, ro: true }
    memory: 1g
    entrypoint: sh
    # Settings are read from KC_* variables set here so the admin and database passwords stay in the
    # environment, not on a command line. Only the HTTPS and management ports listen, on 127.0.0.1.
    command:
      - -c
      - |
        export KC_BOOTSTRAP_ADMIN_USERNAME=admin KC_BOOTSTRAP_ADMIN_PASSWORD="$KEYCLOAK_ADMIN_PASSWORD"
        export KC_DB_USERNAME=keycloak KC_DB_PASSWORD="$KEYCLOAK_DB_PASSWORD"
        exec /opt/keycloak/bin/kc.sh start --optimized --import-realm \
          --http-enabled=false --hostname=https://127.0.0.1:18444 \
          --https-port=18444 --https-certificate-file=/tls/server.crt --https-certificate-key-file=/tls/server.key \
          --https-protocols=TLSv1.3 --http-management-port=19000 --http-host=127.0.0.1 \
          --db-url="jdbc:postgresql://127.0.0.1:15432/keycloak?sslmode=verify-full&sslrootcert=/tls/ca.crt"
