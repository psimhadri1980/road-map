# One issue per task of a spec (the shape /speckit-taskstoissues output should follow). Every field is
# required so no task starts without acceptance criteria and a definition of done.
name: Spec task
description: One task from a spec's tasks.md. One task, one pull request.
labels: [spec-task]
body:
  - type: input
    id: spec
    attributes:
      label: Spec and task id
      description: The spec folder and the task, as in tasks.md.
      placeholder: "001-walking-skeleton / T016"
    validations: { required: true }
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is built and why, in a sentence or two, in the words of the spec.
    validations: { required: true }
  - type: textarea
    id: task
    attributes:
      label: Task
      description: The task text from tasks.md, verbatim, with the files it touches.
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A checklist a reviewer can tick without asking. Start with the task's own test, then each FR/SC it serves (quote the requirement), then the user-story scenarios it contributes to.
      value: |
        - [ ] Test: 
        - [ ] **FR-000** — 
    validations: { required: true }
  - type: textarea
    id: done
    attributes:
      label: Definition of done
      value: |
        - [ ] One pull request implements only this task and says "Closes #<this issue>"
        - [ ] The behaviour is covered by a test that runs against the real services, not mocks (FR-023)
        - [ ] `static` and every other required check is green on the pull request
        - [ ] Comments say why, name the spec or task id, and nothing restates the code (constitution VI, FR-025)
        - [ ] No secret, key or password in the diff or in any output (FR-017b)
        - [ ] The task is marked `[X]` in tasks.md in the same pull request
        - [ ] The change was run through `run/run.sh`, the single entry point
    validations: { required: true }
  - type: textarea
    id: references
    attributes:
      label: References
      description: Links to the spec, plan, research, data model, contracts and the task's line in tasks.md.
    validations: { required: true }
